<!DOCTYPE html>
<!-- cspell:ignoreRegExp >(.*?)< -->
<html lang="{{lang}}">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ScopusSurveyAPI, {{api_description}}" />
    <meta name="author" content="mauprogramador" />
    <meta name="generator"
      content="mkdocs-1.5.3, mkdocs-material-9.5.9, mkdocs-static-i18n-1.2.3, mkdocs-markdownextradata-plugin-0.2.5" />
    <meta property="og:site_name" content="ScopusSurveyAPI" />
    <meta property="og:title" content="ScopusSurveyAPI" />
    <meta property="og:description" content="{{api_description}}">
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="720" />
    <meta property="og:image:height" content="300" />
    <meta property="og:image:alt" content="ScopusSurveyAPI logo" />
    <meta property="og:url" content="{{prefix}}/api" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="ScopusSurveyAPI" />
    <meta property="twitter:description" content="{{api_description}}" />
    <meta property="twitter:image" content="/images/logo.png" />
    <link rel="canonical" href="{{prefix}}/api" />
    <link rel="shortcut icon" href="/images/favicon.png" type="image/x-icon" />
    <link rel="alternate" hreflang="en-US" href="{{prefix}}/api/en-US/search-articles">
    <link rel="alternate" hreflang="pt-BR" href="{{prefix}}/api/pt-BR/search-articles">
    <link rel="stylesheet" href="/styles/styles.css" type="text/css" />
    <link rel="stylesheet" href="/styles/index.css" type="text/css" />
    <link rel="stylesheet" href="/styles/search.css" type="text/css" />
    <link rel="stylesheet" href="/styles/form.css" type="text/css" />
    <link rel="stylesheet" href="/styles/language.css" type="text/css" />
    <link rel="stylesheet" href="/styles/alerts.css" type="text/css" />
    <link rel="stylesheet" href="/styles/loader.css" type="text/css" />
    <title lang="{{lang}}">{{title}}</title>
  </head>

  <body>
    {% include "dialogs.html" %}
    {% include "header.html" %}

    <form id="survey-form" accept-charset="UTF-8" autocomplete="on" method="get"></form>

    <main data-step2="hide">
      {% include "step_0.html" %}
      {% include "step_1.html" %}
      {% include "step_2.html" %}
      {% include "step_3.html" %}
    </main>

    {% include "footer.html" %}

    <div id="context-data" data-lang="{{lang}}" data-csrf-token="{{csrf_token}}" hidden aria-hidden="true"
      aria-readonly="true">
    </div>

    <a id="download-link" rel="external" download="articles.csv" type="text/csv" hidden aria-hidden="true" tabindex="-1"
      aria-readonly="true">&#8203;</a>

    <script src="/scripts/index.js" type="module"></script>
    <script src="/scripts/translations.js" type="module"></script>
    <script src="/scripts/validation.js" type="module"></script>
    <script src="/scripts/button.js" type="module"></script>
    <script src="/scripts/request.js" type="module"></script>
    <script src="/scripts/previous.js" type="module"></script>
    <script src="/scripts/combination.js" type="module"></script>
    <script src="/scripts/search.js" type="module"></script>
    <script src="/scripts/alerts.js" type="module"></script>
    <!-- <script src="/scripts/data.js" type="module"></script> -->
  </body>

</html>
