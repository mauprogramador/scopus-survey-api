<!DOCTYPE html>
<!-- cspell:ignoreRegExp >(.*?)< -->
<html lang="en-US">

  <head>
    <meta charset="UTF-8" />
    <meta name="locale" content="en_US">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% if status_code == 404 %}
    <meta name="robots" content="noindex, nofollow">
    {% endif %}
    <link rel="shortcut icon" href="/images/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="/styles/styles.css" type="text/css" />
    <link rel="stylesheet" href="/styles/error.css" type="text/css" />
    <title lang="en-US">Error - ScopusSurveyAPI</title>
  </head>

  <body>
    <main>

      <div id="error__title">
        <h1 role="alert log" aria-label="HTTP status code error" lang="en-US" title="Error message">{{status_code}}</h1>
        <h2 role="alert log" aria-label="HTTP status error" lang="en-US" title="HTTP status error">{{status}}</h2>
      </div>

      <div id="error__text">
        <h3 role="alert" aria-label="Error message" lang="en-US">{{message}}</h3>
        <time datetime="{{timestamp}}" aria-label="Error timestamp" title="Error timestamp">{{timestamp}}</time>
      </div>

      <div id="page-link">
        <a href="{{prefix}}/web/en-US/search-articles" rel="next" lang="en-US" title="Back to Homepage">
          <span class="icon" aria-label="Home" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
              <path
                d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z" />
            </svg>
          </span>
          Back to Home
        </a>
      </div>

      <div id="details">
        <div id="header">
          <label for="error-json" lang="en-US">Response JSON</label>
          <button id="copy-button" type="button" title="Copy" aria-label="Copy">
            <span class="icon" title="Copy" aria-label="Copy" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                <path
                  d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z" />
              </svg>
            </span>
          </button>
        </div>
        <textarea id="error-json" rows="30" cols="80" wrap="hard" readonly lang="en-US" autocomplete="off"
          spellcheck="off" title="JSON" aria-label="JSON" aria-readonly="true" aria-orientation="vertical"
          aria-required="false" role="alert log">{{error_json}}</textarea>
      </div>

      <div id="footer">
        If the problem persists, please contact support
        <a class="link" href="https://github.com/mauprogramador" target="_blank" rel="author" translate="no"
          title="GitHub @mauprogramador" lang="en-US" aria-label="Author profile">@mauprogramador</a>
      </div>
    </main>
    <script src="/scripts/error.js" type="text/javascript"></script>
  </body>

</html>
