  <body>
    <main>
      <div id="error__title">
        <h1 role="alert log" aria-label="Error message" lang="en-us" title="Error message">{{message}}</h1>
        <h2 role="alert log" aria-label="HTTP status error" lang="en-us" title="HTTP status error">{{status}}</h2>
      </div>
      <div id="error__text">
        <h3 role="alert" aria-label="Error warning" lang="en-us">Oops! That's an error</h3>
        <p role="note" aria-label="Error description" lang="en-us">An unexpected error occurred while trying to
          get/process the requested resource</p>
      </div>
      <div id="error__redirect">
        <p role="alert" aria-label="Redirect message" lang="en-us" title="Redirecting to homepage...">
          This page will be redirected in
          <span id="redirect-time">5s</span>
        </p>
        <time datetime="{{timestamp}}" aria-label="Error timestamp" lang="en-us"
          title="Error timestamp">{{timestamp}}</time>
      </div>
      <div id="page-link">
        <a href="/scopus-survey/api/en/search-articles" class="form-button" rel="next" lang="en-us"
          title="Back to Homepage">
          Back to Home
        </a>
      </div>
    </main>
