<!DOCTYPE html>
<!-- cspell:ignoreRegExp >(.*?)< -->
<html lang="en-US">

  <head>
    <meta charset="UTF-8" />
    <meta name="locale" content="en_US">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% if status_code == 404 %}
    <meta name="robots" content="noindex, nofollow">
    {% endif %}
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/libs/bootstrap/bootstrap.min.css" type="text/css" />
    <link rel="stylesheet" href="/styles/styles.css" type="text/css" />
    <link rel="stylesheet" href="/styles/error.css" type="text/css" />
    <title>Error - ScopusSurveyAPI</title>
  </head>

  <body>
    <main class="vstack justify-content-center align-items-center text-center my-5 mx-auto">

      <div class="mb-4">
        <h1 role="alert log" class="mb-1" aria-label="HTTP status code error">
          {{status_code}}</h1>
        <h2 role="alert log" aria-label="HTTP status error">{{status}}</h2>
      </div>

      <div class="mb-3 text-white">
        <div role="alert" aria-label="Error message">{{message}}</div>
        <small>
          <time datetime="{{timestamp}}" aria-label="Error timestamp">{{timestamp}}</time>
        </small>
      </div>

      <template id="buttons-group">
        <a class="btn btn-scopus text-nowrap" href="{{prefix}}/web/en-US/search-articles">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
            <path d="M160-120v-480l320-240 320 240v480H560v-280H400v280H160Z" />
          </svg>
          Back to Home
        </a>
        <button id="json-button" class="btn btn-light text-nowrap" type="button" data-bs-toggle="collapse"
          data-bs-target="#json-response" aria-controls="json-response" aria-haspopup="tree" aria-expanded="false"
          aria-pressed="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="M480-80 240-320l57-57 183 183 183-183 57 57L480-80ZM298-584l-58-56 240-240 240 240-58 56-182-182-182 182Z" />
          </svg>
          JSON Response
        </button>
        <button id="copy-button" class="btn btn-light text-nowrap" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z" />
          </svg>
          Copy
        </button>
      </template>

      <div id="hbtngp" class="btn-group mb-3 d-none d-sm-inline-flex" role="group" aria-label="Action buttons"></div>
      <div id="vbtngp" class="btn-group-vertical mb-3 d-inline-flex d-sm-none" role="group" aria-label="Action buttons">
      </div>

      <div id="json-response" class="collapse py-2 px-3 rounded-2 bg-white" role="tree" spellcheck="false"
        aria-label="Response error JSON" aria-expanded="false" tabindex="-1">
        {{error_json}}
      </div>

      <div class="d-flex justify-content-center text-white mt-4 gap-1 px-4 flex-wrap">
        <span class="text-nowrap">If the problem persists, please contact support</span>
        <a class="link text-primary" href="https://github.com/mauprogramador" target="_blank"
          rel="author noopener noreferrer" aria-label="Author's GitHub profile" translate="no">@mauprogramador</a>
      </div>
    </main>

    <script src="/libs/bootstrap/bootstrap.bundle.min.js" type="text/javascript"></script>
    <script src="/libs/jsonview/jsonview.min.js" type="text/javascript"></script>
    <script src="/scripts/error.js" type="module"></script>
    <script src="/scripts/button.js" type="module"></script>
  </body>

</html>
