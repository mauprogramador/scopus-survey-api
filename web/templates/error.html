<!DOCTYPE html>
<!-- cspell:ignoreRegExp >(.*?)< -->
<html lang="en-US">
  {% set keywords = "Python; Web API; Scopus; Bibliography Survey" %}

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="{{url_for('web_form_page', lang='en-US')}}">
    <link rel="icon" href="/images/favicon.ico" sizes="256x256" type="image/x-icon">
    <link rel="apple-touch-icon" href="/images/apple-icon.png" sizes="180x180" type="image/png">
    <link rel="image_src" href="images/social-card.png" sizes="1200x630" type="image/png">

    <meta name="generator" content="jinja2-3.1.5, bootstrap-5.3.7, jsonview-1.0.0">
    <title>Error - ScopusSurveyAPI</title>

    <link rel="stylesheet" href="/libs/bootstrap/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/styles/styles.css" type="text/css">
    <link rel="stylesheet" href="/styles/error.css" type="text/css">

    <meta name="application-name" content="Scopus Survey API">
    <meta name="author" content="Maurício da Silva Batista (@mauprogramador)">
    <meta name="description" content="An unexpected error occurred">
    <meta name="keywords" content="{{keywords}}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Error - ScopusSurveyAPI">
    <meta property="og:description" content="An unexpected error occurred">
    <meta property="og:image:alt" content="Error - ScopusSurveyAPI">
    <meta property="og:url" content="{{url_for('web_form_page', lang='en-US')}}">
    <meta property="og:site_name" content="ScopusSurveyAPI">
    <meta property="og:locale" content="en-US">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Error - ScopusSurveyAPI">
    <meta property="twitter:description" content="An unexpected error occurred">

    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#dc3545">
  </head>

  <body>
    <main class="vstack justify-content-center align-items-center text-center my-5 mx-auto">

      <header class="mb-4" aria-label="HTTP Error">
        <h1 class="mb-1">{{status_code}}</h1>
        <h2>{{status}}</h2>
      </header>

      <section class="mb-3 text-white" aria-label="Error details">
        <div>{{message}}</div>
        <small>
          <time datetime="{{timestamp}}">{{timestamp}}</time>
        </small>
      </section>

      <template id="buttons-group">
        <a class="btn btn-scopus text-nowrap" href="{{url_for('web_form_page', lang='en-US')}}">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
            <path d="M160-120v-480l320-240 320 240v480H560v-280H400v280H160Z" />
          </svg>
          Back to Home
        </a>
        <button id="json-button" class="btn btn-light text-nowrap" type="button" data-bs-toggle="collapse"
          data-bs-target="#json-response" aria-controls="json-response" aria-haspopup="tree" aria-expanded="false"
          aria-pressed="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="M480-80 240-320l57-57 183 183 183-183 57 57L480-80ZM298-584l-58-56 240-240 240 240-58 56-182-182-182 182Z" />
          </svg>
          <abbr data-bs-toggle="tooltip" data-bs-title="JavaScript Object Notation" lang="en-US">JSON</abbr> Response
        </button>
        <button id="copy-button" class="btn btn-light text-nowrap" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z" />
          </svg>
          Copy
        </button>
      </template>

      <div id="hbtngp" class="btn-group mb-3 d-none d-sm-inline-flex" role="group" aria-label="Action buttons"></div>
      <div id="vbtngp" class="btn-group-vertical mb-3 d-inline-flex d-sm-none" role="group" aria-label="Action buttons">
      </div>

      <div id="json-response" class="collapse py-2 px-3 rounded-2 bg-white" role="tree" spellcheck="false"
        aria-label="Response error JSON" aria-expanded="false" tabindex="-1">
        {{error_json}}
      </div>

      <div class="d-flex justify-content-center text-white mt-4 gap-1 px-4 flex-wrap">
        <span class="text-nowrap">If the problem persists, please contact support</span>
        <a class="link text-primary" href="https://github.com/mauprogramador" target="_blank"
          rel="author noopener noreferrer" aria-label="Author's GitHub profile" translate="no">@mauprogramador</a>
      </div>
    </main>

    <script src="/libs/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/libs/jsonview/jsonview.min.js"></script>
    <script src="/scripts/error.js" type="module"></script>
    <script src="/scripts/button.js" type="module"></script>
  </body>

</html>
